name: CI Validation & Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Run Library Audit
      run: node scripts/audit-library.js

    - name: Build Manifests
      run: node scripts/build-manifests.js

    - name: Validate Integrity & Schemas
      run: node scripts/validate-library.js

    - name: Run Server Test Suite
      run: node scripts/test-server.js
